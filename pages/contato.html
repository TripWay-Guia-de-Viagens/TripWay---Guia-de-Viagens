<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay - Contato</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="../index.html">TripWay</a></li>
            <li><a href="./destinos.html">Destinos</a></li>
            <li><a href="./pacotes.html">Pacotes de Viagens</a></li>
            <li><a href="./contato.html">Contato</a></li>
        </ul>
    </nav>

    <header>
        <h1>Contato e Reserva</h1>
        <p>Preencha o formulário abaixo para mais informações sobre nossos pacotes de viagem.</p>
    </header>

    <main>
        <section>
            <img src="../images/formulario.png" width="500" alt="Passaporte de viagem">
            <h2>Formulario</h2>

            <form action="">
                <div>
                    <label for="name">Nome</label>
                    <input type="text" id="name" placeholder="Digite seu nome">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email">
                </div>

                <div>
                    <label for="destino">Destino</label>
                    <select name="destino" id="destino">
                        <option value="">Selecione um destino</option>
                        <option value="suecia">Suécia</option>
                        <option value="chile">Chile</option>
                        <option value="portugal">Portugal</option>
                        <option value="alemanha">Alemanha</option>
                        <option value="rj">Rio de Janeiro</option>
                        <option value="bahia">Bahia</option>
                        <option value="sc">Santa Catarina</option>
                    </select>
                </div>

                <div>
                    <label for="data">Data da Viagem</label>
                    <input type="date" id="data">
                </div>

                <div>
                    <label for="quantidade">Quantidade de Pessoas</label>
                    <input type="number" id="quantidade" placeholder="Ex: 2">
                </div>

                <div>
                    <label for="mensagem">Mensagem</label>
                    <input type="text" id="mensagem" placeholder="Digite sua mensagem">
                </div>

                <button>Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 TripWay</p>
    </footer>
</body>
</html>
